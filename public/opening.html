<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Opening…</title>
<style>
  :root { --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --ring:rgba(15,23,42,.12); --accent:#0f766e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --fg:#f1f5f9; --muted:#94a3b8; --ring:rgba(255,255,255,.18); --accent:#5eead4; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px;
    padding-top: max(32px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-text-size-adjust: 100%;
  }
  #icon { width: min(36vw, 160px); height: min(36vw, 160px); object-fit: contain; border-radius: 22%; display: none; }
  .spinner {
    width: min(16vw, 72px); height: min(16vw, 72px); border-radius: 50%;
    border: 6px solid var(--ring); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  h1 { margin: 0; font-size: clamp(1.75rem, 8vw, 2.5rem); font-weight: 700; line-height: 1.2; }
  p  { margin: 0; font-size: clamp(1.125rem, 4.5vw, 1.375rem); color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
  <img id="icon" alt="">
  <div class="spinner" role="progressbar" aria-label="Loading"></div>
  <h1 id="title">Opening…</h1>
  <p>Just a moment</p>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var name = (q.get('app') || '').slice(0, 40);
    if (name) {
      document.getElementById('title').textContent = 'Opening ' + name + '…';
      document.title = 'Opening ' + name + '…';
    }
    var icon = q.get('icon') || '';
    // same-origin relative paths only
    if (/^\/[^\/\\]/.test(icon)) {
      var img = document.getElementById('icon');
      img.onload = function () { img.style.display = 'block'; };
      img.src = icon;
    }
  })();
</script>
</body>
</html>
