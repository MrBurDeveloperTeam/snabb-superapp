<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Opening…</title>
<script>
  // Same theme resolution as the mini apps: shared .snabbb.com cookie first.
  (function () {
    function cookie(n) {
      var p = document.cookie ? document.cookie.split(';') : [];
      for (var i = 0; i < p.length; i++) {
        var s = p[i].trim();
        if (s.indexOf(n + '=') === 0) return decodeURIComponent(s.slice(n.length + 1));
      }
      return null;
    }
    function parse(raw) {
      if (!raw) return null;
      var v = String(raw).trim();
      try {
        var j = JSON.parse(v);
        if (typeof j === 'string') v = j;
        else if (j && j.state && j.state.theme) v = j.state.theme;
        else if (j && j.theme) v = j.theme;
      } catch (e) {}
      v = String(v).trim().toLowerCase();
      return v === 'light' || v === 'dark' || v === 'system' ? v : null;
    }
    var stored = null;
    try { stored = localStorage.getItem('snabbb-theme'); } catch (e) {}
    var t = parse(cookie('snabbb-theme')) || parse(stored) || 'light';
    if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
html,body{height:100%;margin:0}
body{background:var(--ls-bg)}
html{--ls-bg:#F3F6F8;--ls-fg:#172B4D;--ls-ring:rgba(23,43,77,.12);--ls-accent:#2A9D8F}
html[data-theme="dark"]{--ls-bg:#0F1115;--ls-fg:#F1F5F9;--ls-ring:rgba(255,255,255,.18);--ls-accent:#5EEAD4}
.ls{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));text-align:center;background:var(--ls-bg);color:var(--ls-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.2;letter-spacing:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
.ls,.ls *{box-sizing:border-box;margin:0;padding:0}
.ls{padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
.ls-icon{width:min(36vw,160px);height:min(36vw,160px);object-fit:contain;border-radius:22%}
.ls-spinner{width:min(16vw,72px);height:min(16vw,72px);border-radius:50%;border:6px solid var(--ls-ring);border-top-color:var(--ls-accent);animation:ls-spin .8s linear infinite}
.ls-title{margin:0;padding:0;font-family:inherit;font-size:clamp(1.75rem,8vw,2.5rem);font-weight:700;line-height:1.2;letter-spacing:normal;text-transform:none}
@keyframes ls-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ls-spinner{animation-duration:2.4s}}
</style>
</head>
<body>
<div class="ls" role="status" aria-live="polite"><img id="icon" class="ls-icon" alt="" width="160" height="160"><div class="ls-spinner" aria-hidden="true"></div><h1 class="ls-title" id="title">Opening…</h1></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var name = (q.get('app') || '').slice(0, 40);
    if (name) {
      document.getElementById('title').textContent = 'Opening ' + name + '…';
      document.title = 'Opening ' + name + '…';
    }
    var icon = q.get('icon') || '';
    if (/^\/[^\/\\]/.test(icon)) document.getElementById('icon').src = icon;
  })();
</script>
</body>
</html>
