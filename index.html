
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/pet.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/favicon.png" />
    <title>App.Snabbb</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png?v=1">
    <!-- Tailwind is compiled at build time (see tailwind.config.js); no CDN runtime. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"></noscript>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <!-- Apply persisted/system theme before paint to avoid a light-mode flash (FOUC) -->
    <script>
      (function () {
        try {
          var key = "snabbb-theme";
          var stored = localStorage.getItem(key);
          var theme = "light";
          if (stored) {
            // Zustand persist() wraps state in JSON; read the nested `theme` if present.
            var parsed = JSON.parse(stored);
            theme = (parsed && parsed.state && parsed.state.theme) || parsed.theme || "light";
          }
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (theme === "system" && prefersDark);
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) { /* no-op: fall back to light until React hydrates */ }
      })();
    </script>
    <style>
      :root {
        --mesh-bg: radial-gradient(at 0% 0%, hsla(210,100%,98%,1) 0, transparent 50%), 
                   radial-gradient(at 50% 0%, hsla(225,100%,96%,1) 0, transparent 50%), 
                   radial-gradient(at 100% 0%, hsla(200,100%,98%,1) 0, transparent 50%);
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
        background-image: var(--mesh-bg);
        background-attachment: fixed;
        color: #0f172a;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .pet-interface {
        font-family: 'Fredoka', sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      /* Pre-React splash so the page is never blank while the JS bundle loads */
      html.dark body { background-color: #0F1115; background-image: none; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px; text-align: center; align-items: center; justify-content: center; }
      .boot-text { margin: 0; font-size: 16px; font-weight: 600; color: #475569; }
      html.dark .boot-text { color: #cbd5e1; }
      .boot-spinner { width: 56px; height: 56px; border-radius: 50%; border: 5px solid rgba(23,43,77,.12); border-top-color: #2A9D8F; animation: boot-spin .8s linear infinite; }
      html.dark .boot-spinner { border-color: rgba(255,255,255,.18); border-top-color: #5EEAD4; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      /* Custom icon color gradients */
      .fa-icon-gradient {
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
</head>

</html>
